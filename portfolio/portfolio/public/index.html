<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio of projects, skills and contact details.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="top">
    <nav aria-label="Main">
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-live="polite">
      <h1 id="name">Loading…</h1>
      <p class="role" id="title"></p>
      <p class="bio" id="bio"></p>
      <p class="links" id="socials"></p>
    </section>

    <section id="projects" aria-labelledby="projects-h">
      <h2 id="projects-h">Projects</h2>
      <div id="project-list" class="rows"></div>
    </section>

    <section id="skills" aria-labelledby="skills-h">
      <h2 id="skills-h">Skills</h2>
      <div id="skill-groups" class="skill-groups"></div>
    </section>

    <section id="contact" aria-labelledby="contact-h">
      <h2 id="contact-h">Contact</h2>
      <form id="contact-form" novalidate>
        <label>Name <input name="name" autocomplete="name" required maxlength="80"></label>
        <span class="err" data-for="name"></span>
        <label>Email <input name="email" type="email" autocomplete="email" required maxlength="120"></label>
        <span class="err" data-for="email"></span>
        <label>Subject (optional) <input name="subject" maxlength="120"></label>
        <span class="err" data-for="subject"></span>
        <label>Message <textarea name="message" rows="6" required minlength="10" maxlength="2000"></textarea></label>
        <span class="err" data-for="message"></span>
        <div class="trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
        <button type="submit">Send message</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <footer><span id="footer-name"></span></footer>
  <script src="/js/app.js" defer></script>
</body>
</html>
